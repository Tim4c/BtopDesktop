name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint, and test
    # Apple Silicon, macOS 27; this GitHub-hosted image is currently in preview.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BTOP_CODESIGN_IDENTITY: "-"
    defaults:
      run:
        shell: zsh {0}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check environment and prepare Metal Toolchain
        run: scripts/prepare-metal.zsh

      - name: Build and verify application
        run: scripts/build-app.zsh

      - name: Lint
        run: scripts/lint.zsh

      - name: Test
        run: swift test

      - name: Verify application signature
        run: codesign --verify --deep --strict BtopDesktop.app
